name: Secret Santa notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for due notifications
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=secret-santa-notifications" | jq -er .value)
          echo "::add-mask::$token"
          curl --fail --silent --show-error --max-time 50 -X POST -H "Authorization: Bearer $token" https://secret-santa-three-chi.vercel.app/api/tick
