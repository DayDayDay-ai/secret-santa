<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тайный Санта</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#102b25;color:#f6f0df;font:16px system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 50% 0,#345a48,transparent 70%)}main{max-width:480px;margin:auto;padding:24px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:3px;color:#e6c690}h1{font-family:Georgia,serif;font-weight:400;font-size:43px;line-height:1.02;margin:18px 0}h2{font-family:Georgia,serif;font-weight:400;font-size:27px;margin:0 0 14px}p,small{color:#c3d5ca}section{background:#ffffff0b;border:1px solid #ffffff20;border-radius:23px;padding:19px;margin:15px 0;box-shadow:0 10px 35px #0002}button,input,textarea,select{font:inherit;border-radius:13px;padding:13px;width:100%;margin:5px 0}button{border:0;background:#e9cf9b;color:#17372b;font-weight:700;cursor:pointer}button.secondary{background:#ffffff0a;color:#f6f0df;border:1px solid #ffffff30}button:disabled{opacity:.45}input,textarea,select{background:#142e27;color:#fff;border:1px solid #ffffff30}label{font-size:13px;color:#d5e3d9}nav{display:flex;gap:6px}nav button{font-size:13px}nav button.active{background:#e9cf9b;color:#17372b}.gift{display:flex;gap:12px;align-items:center;margin:12px 0;overflow-wrap:anywhere}.gift img{width:82px;height:82px;object-fit:cover;border-radius:13px}.gift div{flex:1;min-width:0}a{color:#e9cf9b} .count{font-size:30px;font-variant-numeric:tabular-nums;color:#e9cf9b}.error{color:#ffd1c9}.snow{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:-1}.flake{position:absolute;color:#ffffff50;animation:fall linear infinite}@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(110vh)}}@media(prefers-reduced-motion:reduce){.flake{animation:none}}.row{display:flex;gap:8px;align-items:center}.row button{width:auto}.muted{opacity:.65}.pill{border:1px solid #d0b87c66;border-radius:40px;padding:6px 12px;font-size:12px;color:#e9cf9b} .hero{text-align:center;padding:20px 0}.ornament{font-size:60px;filter:drop-shadow(0 8px 20px #e9cf9b33)}
</style><link rel="stylesheet" href="holiday.css"></head><body><div class="snow" id="snow"></div><main><div class="banner"><div class="art" aria-hidden="true"><span class="stars">✧<i>✦</i></span><i class="bauble small"></i><i class="bauble"></i></div><h1>Тайный Санта</h1><p>Новогодний обмен подарками</p></div><div id="error" class="error" role="alert"></div><div id="app">Загрузка…</div></main><script type="module">
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const app=document.querySelector('#app'),err=document.querySelector('#error');const reveal=new URLSearchParams(location.search).get('reveal');let demo=reveal==='demo';let state,tab=reveal?'target':'home',editing=null,busy=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(let i=0;i<20;i++){let f=document.createElement('span');f.className='flake';f.textContent='✦';f.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*15}s;animation-delay:-${Math.random()*20}s;font-size:${8+Math.random()*12}px`;document.querySelector('#snow').append(f)}
async function call(action='state',data={}){if(busy)return false;busy=true;err.textContent='';try{const r=await fetch('/api/index',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData,action,demo,...data})});const j=await r.json();if(!r.ok)throw Error(j.error);state=j;return true}catch(e){err.textContent=e.message;return false}finally{busy=false}}
const btn=(t,a,c='')=>`<button class="${c}" data-action="${a}">${t}</button>`;const dateText=()=>state.date?new Date(state.date).toLocaleString('ru-RU',{timeZone:'Asia/Almaty'}):'Дата пока не назначена';function localDate(d){return d?new Date(Date.parse(d)+5*3600000).toISOString().slice(0,16):''}function cards(gifts,own){return gifts.length?gifts.map((g,i)=>`<div class="gift"><img src="${esc(g.photo)}" alt=""><div><strong>${esc(g.name)}</strong><br><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">Открыть товар ↗</a><br><small>${esc(g.note)}</small>${own?`<div class="row">${btn('Изменить','edit:'+i,'secondary')}${btn('Удалить','delete:'+i,'secondary')}</div>`:''}</div></div>`).join(''):'<p>Пока нет подарков.</p>'}
function recipientCards(gifts) {
  if (!gifts.length) return '<p>Пока нет подарков.</p>';
  return gifts.map((gift, index) => {
    const note = gift.note?.trim();
    const comment = !note ? '' : note.length > 95 || note.includes('\n')
      ? `<details class="gift-comment"><summary>Комментарий</summary><p>${esc(note)}</p></details>`
      : `<p class="gift-comment">${esc(note)}</p>`;
    return `<article class="gift recipient-gift"><img src="${esc(gift.photo)}" alt="" loading="lazy"><div><div class="recipient-gift-title"><a href="${esc(gift.url)}" target="_blank" rel="noopener noreferrer">${esc(gift.name)}</a>${btn('Копировать','copyGift:'+index,'secondary')}</div>${comment}</div></article>`;
  }).join('');
}
function render(){if(!state)return;let out=demo?'<small>Пробная жеребьёвка · 6 из 6 участников</small>'+btn('Вернуться на главную','exitDemo','secondary'):'';if(!state.me){out+=`<section><h2>Кто ты?</h2><p>Выбери своё имя и повтори его точно как в списке.</p><select id="person"><option value="">Выбрать себя</option>${state.people.map((p,i)=>`<option value="${i}" ${p.claimed?'disabled':''}>${esc(p.name)}${p.claimed?' • занято':''}</option>`).join('')}</select><input id="name" placeholder="Напиши своё имя" autocomplete="off">${btn('Присоединиться','claim')}</section>`}if(!demo&&(state.me||state.admin)){out+=`<nav>${state.me?btn('Главная','tab:home',tab==='home'?'active':'secondary')+btn('Добавить подарок','tab:gifts',tab==='gifts'?'active':'secondary')+btn('Кому я дарю','tab:target',tab==='target'?'active':'secondary'):''}</nav>`}if(state.me&&tab==='home'){out+=`<section class="${state.target?'reveal-ready':''}"><h2>${state.target?'Подарок под ёлкой готов':'Твоя тайна под ёлкой'}</h2><p>${state.target?'Узнай, для кого ты готовишь подарок.':state.revealBlocked?'Прежнее назначение недоступно после сброса профиля.':state.date?'Имя откроется в назначенное время, когда все зарегистрируются.':'Дата раскрытия ещё не выбрана.'}</p>${state.target?btn('🎁 Открыть подарок','tab:target','unwrap-button'):btn('Узнать, кому я дарю','tab:target','secondary')}</section><section class="home-countdown"><span class="pill">Привет, ${esc(state.me.name)}!</span><h2 style="margin-top:15px">До раскрытия тайны</h2><div class="count" id="timer"></div><p>${esc(dateText())} · Алматы</p><p>Участники: ${state.people.filter(p=>p.claimed).length}/6</p>${state.budget?`<p>Бюджет: ${esc(state.budget)}</p>`:''}${btn('Добавить подарок','tab:gifts')}</section>`}if(state.me&&tab==='gifts'){const g=editing!==null?state.me.gifts[editing]:{};out+=`<section><h2>Мои желания</h2>${cards(state.me.gifts,true)}</section><section><h2>${editing!==null?'Редактировать':'Добавить подарок'}</h2><label>Название</label><input id="giftname" maxlength="100" value="${esc(g?.name)}"><label>Ссылка на товар</label><input id="url" type="url" value="${esc(g?.url)}" placeholder="https://kaspi.kz/…"><div id="photo-upload"><label class="gallery-picker" for="photo">Добавить фото</label><input class="gallery-input" id="photo" type="file" accept="image/*"></div><img id="photo-preview" alt="Фото подарка" hidden style="max-width:100%;max-height:180px"><p id="photo-status" role="status" hidden></p><label>Комментарий</label><textarea id="note" maxlength="500">${esc(g?.note)}</textarea>${btn('Сохранить подарок','saveGift')}${editing!==null?btn('Отмена','cancel','secondary'):''}</section>`}if(state.me&&tab==='target'){out+=state.target?`<section><div class="hero reveal"><span class="box" aria-hidden="true"></span><p>Ты даришь подарок</p><h1>${esc(state.target.name)}</h1><p class="recipient-budget">${state.budget?'Бюджет подарка · '+esc(state.budget):'Бюджет пока не указан'}</p></div></section><section><h2>Список желаний</h2>${recipientCards(state.target.gifts)}</section>`:`<section><h2>🔒 Пока секрет</h2><p>${state.revealBlocked?'Прежнее назначение недоступно после сброса профиля.':state.date?'Имя откроется в назначенное время, когда все шесть участников зарегистрируются.':'Дата раскрытия ещё не выбрана.'}</p>${btn('Добавить подарок','tab:gifts')}${btn('Вернуться на главную','tab:home','secondary')}</section>`}if(state.admin&&tab==='admin'){out+=`<section><h2>Настройки события</h2><label>Дата и время (Алматы)</label><input id="date" type="datetime-local" value="${localDate(state.plannedDate||state.date)}" ${state.drawn?'disabled':''}><label>Бюджет</label><input id="budget" value="${esc(state.budget)}" placeholder="20 000 ₸">${btn('Сохранить настройки','settings')}<p>Жеребьёвка: ${state.drawn?'проведена':'ожидается'}</p><p>Резервная копия: ${state.backupSaved?'✓ сохранена':'будет создана при жеребьёвке'}</p>${state.backupSaved?`<small>${esc(new Date(state.backupSavedAt).toLocaleString('ru-RU',{timeZone:'Asia/Almaty'}))} · Алматы</small>${btn('Восстановить первую жеребьёвку','restoreDraw','secondary')}`:''}<p><small>Результаты фиксируются навсегда. Сброс очищает желания и закрывает доступ к прежнему назначению.</small></p></section><section><h2>Участники</h2>${state.people.map((p,i)=>`<div class="row"><div style="flex:1">${esc(p.name)}<br><small>${p.claimed?'Зарегистрирован':'Ожидает'}</small></div>${p.claimed?btn('Сбросить','resetProfile:'+i,'secondary'):''}</div>`).join('')}<small>В админ-панели нет подарков и результатов.</small></section>`}if(state.me&&state.admin&&tab==='gifts')out+=btn('Настройки','tab:admin','secondary');app.dataset.tab=tab;app.innerHTML=out;timer();setupGiftForm()}
function closeGiftFormIfDue(){if(tab!=='gifts'||editing!==null||!(state?.drawn||(state?.full&&Date.parse(state.date)<=Date.now())))return;const form=app.querySelector('#giftname')?.closest('section');if(form)form.innerHTML='<p>Срок добавления подарков прошёл.</p>'}function timer(){closeGiftFormIfDue();let e=document.querySelector('#timer');if(!e)return;let n=Date.parse(state.date)-Date.now();e.hidden=!state.date;if(!state.date)return;if(!state.full&&!state.drawn){e.textContent='Ждём всех шестерых';return}if(n<=0)e.textContent=state.drawn?'Тайна раскрыта':'Открываем конверты…';else{let s=Math.floor(n/1000);e.textContent=`${Math.floor(s/86400)}д ${String(Math.floor(s/3600)%24).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}}
async function photo(file){if(!file)throw Error('Добавь фотографию');const im=new Image();const url=URL.createObjectURL(file);try{im.src=url;await im.decode();let c=document.createElement('canvas'),scale=Math.min(1,720/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);for(let q=.82;q>=.2;q-=.1){const d=c.toDataURL('image/jpeg',q);if(d.length<=60000)return d}throw Error('Фото слишком большое')}finally{URL.revokeObjectURL(url)}}
function setupGiftForm() {
  const link = app.querySelector('#url');
  if (!link) return;
  const name = app.querySelector('#giftname');
  const preview = app.querySelector('#photo-preview');
  const status = app.querySelector('#photo-status');
  const save = app.querySelector('[data-action="saveGift"]');
  let revision = 0;
  let preparing = false;
  function validate() {
    let valid = false;
    try { valid = ['https:', 'http:'].includes(new URL(link.value.trim()).protocol); } catch {}
    save.disabled = preparing || !name.value.trim() || !valid || !preview.hasAttribute('src');
  }
  const previous = editing === null ? null : state.me.gifts[editing];
  if (previous?.photo) {
    preview.src = previous.photo;
    preview.hidden = false;
  }
  link.addEventListener('input', validate);
  name.addEventListener('input', validate);
  app.querySelector('#photo').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    const current = ++revision;
    preparing = true;
    validate();
    status.hidden = false;
    status.textContent = 'Готовим фото…';
    try {
      const image = await photo(file);
      if (current !== revision) return;
      preview.src = image;
      preview.hidden = false;
      status.textContent = 'Фото готово';
    } catch {
      if (current !== revision) return;
      event.target.value = '';
      status.textContent = 'Не удалось обработать фото. Выбери другое изображение.';
    } finally {
      if (current === revision) {
        preparing = false;
        validate();
      }
    }
  });
  validate();
}
app.addEventListener('click',async e=>{const trigger=e.target.closest('[data-action]');const a=trigger?.dataset.action;if(!a||busy||app.classList.contains('section-leaving'))return;const [cmd,arg]=a.split(':');const val=id=>document.getElementById(id)?.value;let ok=false;const showPending=['claim','saveGift','settings','restoreDraw','resetProfile','delete'].includes(cmd);if(showPending){trigger.classList.add('button-pending');trigger.setAttribute('aria-busy','true');}try{if(cmd==='exitDemo'){demo=false;if(!await call()){demo=true;return}const url=new URL(location.href);url.searchParams.delete('reveal');history.replaceState(null,'',url);tab=!state.me&&state.admin?'admin':'home';editing=null;render();return}if(cmd==='tab'){
  if(tab===arg || app.classList.contains('section-leaving'))return;
  const selected=app.querySelector('nav [data-action="tab:'+arg+'"]');
  for(const button of app.querySelectorAll('nav button')){
    button.classList.toggle('active',button===selected);
    button.classList.toggle('secondary',button!==selected);
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    app.classList.add('section-leaving');
    await new Promise(resolve=>setTimeout(resolve,125));
    app.classList.remove('section-leaving');
  }
  tab=arg;
  editing=null;
  render();
  for(const section of app.querySelectorAll('section'))section.classList.add('section-enter');
  return;
}if(cmd==='copyGift'){
  const gift=state.target?.gifts[Number(arg)];
  if(!gift)return;
  try{
    await navigator.clipboard.writeText(gift.url);
  }catch{
    const input=document.createElement('textarea');
    input.value=gift.url;
    input.style.position='fixed';
    input.style.opacity='0';
    document.body.append(input);
    input.select();
    try{
      if(!document.execCommand('copy'))throw Error('Не удалось скопировать ссылку');
    }finally{input.remove();trigger.focus();}
  }
  trigger.textContent='Готово';
  setTimeout(()=>{trigger.textContent='Копировать'},1100);
  return;
}
if(cmd==='edit'){editing=Number(arg);render();return}if(cmd==='cancel'){editing=null;render();return}if(cmd==='claim'){if(val('person')==='')throw Error('Выбери себя');ok=await call('claim',{index:Number(val('person')),name:val('name')});if(ok)tab='home'}if(cmd==='saveGift'){const preview=app.querySelector('#photo-preview');const name=val('giftname').trim();const url=new URL(val('url')).href;if(!name||!preview.hasAttribute('src'))return;ok=await call(editing===null?'add':'edit',{index:editing,gift:{name,url,note:val('note'),photo:preview.src}});if(ok)editing=null}if(cmd==='delete'&&confirm('Удалить подарок?'))ok=await call('delete',{index:Number(arg)});if(cmd==='settings')ok=await call('settings',{date:val('date')+'+05:00',budget:val('budget')});if(cmd==='restoreDraw'&&confirm('Восстановить первое распределение без изменения получателей?'))ok=await call('restoreDraw');if(cmd==='resetProfile'&&confirm('Сбросить профиль? Его желания будут удалены, а доступ к прежнему назначению закрыт.'))ok=await call('resetProfile',{index:Number(arg)});if(ok)render()}catch(e){err.textContent=e.message}finally{if(showPending){trigger.classList.remove('button-pending');trigger.removeAttribute('aria-busy');}}});if(tg?.initData){if(await call()){if(!state.me&&state.admin)tab='admin';render()}}else app.innerHTML='<section><h2>Открой в Telegram</h2><p>Приложение работает через кнопку в боте.</p></section>';setInterval(timer,1000);setInterval(async()=>{if(state&&['home','target'].includes(tab)&&!state.drawn&&!demo&&!document.hidden){if(await call())render()}},15000);
</script></body></html>
